services:
  healthcheck:
    container_name: healthcheck
    command: echo pmm healthcheck succeeded
    image: alpine
    depends_on:
      pmm-server:
        condition: service_healthy

  pmm-server:
    container_name: pmm
    image: percona/pmm-server:3.7.0
    ports:
      - 32433:8080
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - pmm-data:/srv
    healthcheck:
      test: curl localhost:8080/server/login | grep Unauthorized
      interval: 1s
      retries: 100
      start_period: 1s
      timeout: 10s
  pmm-proxy:                                                                                                 
    image: nginx:alpine
    ports:                                                                                               
      - 32434:80                        
    command: >      
      sh -c "printf 'server { listen 80; location / { proxy_pass http://pmm-server:8080;                       
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;                                                             
      proxy_redirect http://pmm-server/ http://localhost:32434/;
      proxy_cookie_domain pmm-server localhost;
      proxy_cookie_flags ~ samesite=none secure;
      proxy_set_header Origin http://pmm-server:8080; } }'
      > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'" 
    depends_on:
      pmm-server:                                                                                        
        condition: service_healthy 
volumes:
  pmm-data:
# Test Docker Compose
# docker compose up
# docker compose down
# Accessing to the dashboard: http://localhost:32433/graph/login
